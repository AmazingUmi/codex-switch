name: Bug report / 问题报告
description: Report a Codex Switch problem / 报告 Codex Switch 问题
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: build
    attributes:
      label: Build and platform / 构建与平台
      description: Include the commit, OS and regular or preview profile.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and expected behavior / 复现步骤与预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
      description: Redact credentials, account data and session content from logs.
    validations:
      required: true
