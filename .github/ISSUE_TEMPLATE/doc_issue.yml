name: Documentation / 文档问题
description: Correct current project documentation / 修正当前项目文档
labels: [documentation]
body:
  - type: input
    id: location
    attributes:
      label: Document and section / 文档与章节
      placeholder: README.md or docs/CONFIGURATION.md
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Problem and proposed correction / 问题与建议修正
    validations:
      required: true
